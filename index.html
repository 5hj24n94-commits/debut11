<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나만의 데뷔조 만들기</title>
<!-- 화면 캡처 및 이미지 저장을 위한 라이브러리 -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  body { font-family: 'Pretendard', -apple-system, sans-serif; text-align: center; background-color: #fce4ec; margin: 0; padding: 20px; }
  h1 { color: #d81b60; }
  .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  
  /* 101명 그리드 설정 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; margin-top: 20px; max-height: 500px; overflow-y: auto; padding: 10px; border: 1px solid #ddd; border-radius: 10px; }
  .trainee { width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.2s; object-fit: cover; background: #f5f5f5; }
  .trainee:hover { transform: scale(1.05); }
  .trainee.selected { border-color: #e91e63; transform: scale(1.1); background: #fff0f5; }
  
  /* 카운터 및 버튼 */
  .status { margin: 20px 0; font-size: 1.2em; font-weight: bold; color: #333; }
  .btn { padding: 12px 24px; font-size: 1.1em; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; margin: 5px; }
  .btn-submit { background-color: #e0e0e0; color: #9e9e9e; pointer-events: none; }
  .btn-submit.active { background-color: #e91e63; color: white; pointer-events: auto; }
  .btn-submit.active:hover { background-color: #c2185b; }
  
  /* 결과 화면 */
  #result-area { display: none; }
  .pyramid { display: flex; flex-direction: column; align-items: center; gap: 15px; padding: 30px; background: #fff0f5; border-radius: 15px; }
  .row { display: flex; justify-content: center; gap: 15px; }
  .row-wrap { display: flex; flex-direction: column; align-items: center; }
  .row img { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #f06292; object-fit: cover; background: white; }
  .center-label { text-align: center; font-weight: bold; color: #d81b60; margin-top: 5px; font-size: 0.9em; }
  
  /* 공유 및 액션 버튼 */
  .btn-save { background-color: #4CAF50; color: white; }
  .btn-twitter { background-color: #000000; color: white; } /* X 브랜드 컬러 적용 */
</style>
</head>
<body>

<!-- 1단계: 선택 화면 -->
<div class="container" id="main-container">
  <h1>✨ 나만의 데뷔조 만들기 ✨</h1>
  <p>101명의 연습생 중 당신의 마음을 훔친 11명을 선택하세요!</p>
  
  <div class="status">선택된 연습생: <span id="count" style="color: #e91e63;">0</span> / 11</div>
  <button id="submit-btn" class="btn btn-submit">[나만의 데뷔조] (11명 선택 필요)</button>
  
  <div class="grid" id="trainee-grid"></div>
</div>

<!-- 2단계: 결과 화면 -->
<div class="container" id="result-area">
  <h1>🎉 나만의 픽! 탑 11 🎉</h1>
  <div class="pyramid" id="capture-area">
    <h2 style="color: #d81b60; margin: 0 0 20px 0;">MY DEBUT GROUP</h2>
    <div class="row" id="row1"></div> <!-- 1명 (센터) -->
    <div class="row" id="row2"></div> <!-- 3명 -->
    <div class="row" id="row3"></div> <!-- 3명 -->
    <div class="row" id="row4"></div> <!-- 4명 -->
  </div>
  
  <div style="margin-top: 20px;">
    <button class="btn btn-save" onclick="saveImage()">⬇️ 이미지로 저장</button>
    <button class="btn btn-twitter" onclick="shareTwitter()">𝕏 트위터 공유</button>
    <button class="btn" style="background:#ddd; color:#333;" onclick="location.reload()">🔄 다시 하기</button>
  </div>
</div>

<script>
  const grid = document.getElementById('trainee-grid');
  const countDisplay = document.getElementById('count');
  const submitBtn = document.getElementById('submit-btn');
  const mainContainer = document.getElementById('main-container');
  const resultArea = document.getElementById('result-area');
  let selected = [];

  // 101명의 임시 아바타 이미지 생성
  for (let i = 1; i <= 101; i++) {
    const img = document.createElement('img');
    // 무작위 귀여운 캐릭터 이미지를 가져오는 무료 API 적용
    img.src = `https://api.dicebear.com/7.x/notionists/svg?seed=Trainee${i}&backgroundColor=transparent`;
    img.className = 'trainee';
    img.dataset.id = i;
    img.onclick = () => toggleSelection(img);
    grid.appendChild(img);
  }

  // 클릭 시 선택/해제 토글 로직
  function toggleSelection(img) {
    const id = img.dataset.id;
    const index = selected.findIndex(item => item.id === id);

    if (index > -1) {
      selected.splice(index, 1);
      img.classList.remove('selected');
    } else {
      if (selected.length >= 11) {
        alert('이미 11명을 모두 선택했습니다!');
        return;
      }
      selected.push({ id, src: img.src });
      img.classList.add('selected');
    }
    updateStatus();
  }

  // 카운트 및 완료 버튼 상태 업데이트
  function updateStatus() {
    countDisplay.innerText = selected.length;
    if (selected.length === 11) {
      submitBtn.classList.add('active');
      submitBtn.innerText = "[나만의 데뷔조] 결과 보기!";
    } else {
      submitBtn.classList.remove('active');
      submitBtn.innerText = `[나만의 데뷔조] (${11 - selected.length}명 더 선택 필요)`;
    }
  }

  // 완료 버튼 클릭 시 결과 화면 배열
  submitBtn.onclick = () => {
    if (selected.length !== 11) return;
    
    mainContainer.style.display = 'none';
    resultArea.style.display = 'block';

    // 1 - 3 - 3 - 4 피라미드 배열 (총 11명)
    const layouts = [1, 3, 3, 4];
    let currentIndex = 0;

    layouts.forEach((count, rowIndex) => {
      const row = document.getElementById(`row${rowIndex + 1}`);
      for (let i = 0; i < count; i++) {
        if(currentIndex >= 11) break;
        
        const wrap = document.createElement('div');
        wrap.className = 'row-wrap';
        
        const img = document.createElement('img');
        img.src = selected[currentIndex].src;
        wrap.appendChild(img);
        
        if(rowIndex === 0) {
          const label = document.createElement('div');
          label.className = 'center-label';
          label.innerText = '👑 CENTER';
          wrap.appendChild(label);
        }
        
        row.appendChild(wrap);
        currentIndex++;
      }
    });
  };

  // 캡처 후 이미지 저장 기능
  function saveImage() {
    const captureArea = document.getElementById('capture-area');
    html2canvas(captureArea, { backgroundColor: '#fff0f5', scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'my_top11_debut_group.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  // X(트위터) 연동 공유 기능
  function shareTwitter() {
    const text = encodeURIComponent("나만의 데뷔조 11명을 완성했습니다! 🌟 여러분의 픽은 누구인가요?\n#나만의데뷔조 #TOP11 #가상아이돌");
    // 실제 호스팅한 본인 사이트 주소가 들어가는 부분
    const url = encodeURIComponent(window.location.href); 
    window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
  }
</script>
</body>
</html>
